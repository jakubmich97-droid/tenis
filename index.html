<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tenisová bilance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">🎾 Osobní tenisová statistika</p>
        <h1>Kuba vs Filip</h1>
        <p>Sleduj výhry, sety, gemy a historii vzájemných zápasů.</p>
      </div>
    </header>

    <section class="stats-grid" id="statsGrid"></section>

    <section class="card form-card">
      <h2>Přidat zápas</h2>

      <form id="matchForm">
        <div class="form-grid">
          <input type="date" id="date" required />
          
          <select id="surface">
            <option value="Antuka">Antuka</option>
            <option value="Hard">Hard</option>
            <option value="Umělka">Umělka</option>
            <option value="Tráva">Tráva</option>
          </select>

          <input type="number" id="kubaSet1" placeholder="Kuba set 1" min="0" required />
          <input type="number" id="filipSet1" placeholder="Filip set 1" min="0" required />

          <input type="number" id="kubaSet2" placeholder="Kuba set 2" min="0" required />
          <input type="number" id="filipSet2" placeholder="Filip set 2" min="0" required />

          <input type="number" id="kubaSet3" placeholder="Kuba set 3 / TB" min="0" />
          <input type="number" id="filipSet3" placeholder="Filip set 3 / TB" min="0" />

          <input class="wide" type="text" id="note" placeholder="Poznámka např. supertiebreak, vítr, forma..." />
        </div>

        <button type="submit">Uložit zápas</button>
      </form>
    </section>

    <section class="card">
      <div class="table-head">
        <h2>Historie zápasů</h2>
        <button id="clearBtn" class="ghost">Smazat vše</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Povrch</th>
              <th>Vítěz</th>
              <th>Výsledek</th>
              <th>Sety Kuba</th>
              <th>Sety Filip</th>
              <th>Gemy Kuba</th>
              <th>Gemy Filip</th>
              <th>Poznámka</th>
            </tr>
          </thead>
          <tbody id="matchesTable"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
